<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f0"><meta name="apple-mobile-web-app-capable" content="yes"><title>精神漫游 · 私人作品库</title><style>
:root{--bg:#f7f5f0;--paper:#fffefa;--ink:#273431;--muted:#738078;--line:#e3e7df;--green:#38695c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1040px;margin:auto;padding:30px 18px 100px}.small{font-size:11px;letter-spacing:.18em;color:var(--green);font-weight:700}h1{font-family:Georgia,"Songti SC",serif;font-size:36px;font-weight:500;margin:12px 0}.muted{color:var(--muted);font-size:14px;line-height:1.7}.hero{padding:20px 0 26px;border-bottom:1px solid var(--line)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.actions,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.btn,select,input,textarea{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:12px}.btn{cursor:pointer;font-size:13px}.primary{background:var(--green);border-color:var(--green);color:white}input[type=search]{flex:1;min-width:170px}.stats{display:flex;gap:26px;margin:22px 0}.stat b{display:block;font-size:27px;font-weight:500}.stat span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;min-height:160px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px}.card .cat{font-size:11px;color:var(--green)}.card h3{font-size:18px;font-weight:550;margin:0;line-height:1.4}.card .meta{margin-top:auto;font-size:12px;color:var(--muted)}.empty{padding:62px 20px;text-align:center;border:1px dashed #bfcac0;border-radius:18px;background:var(--paper)}.empty h2{font-size:22px;font-weight:500}.dialog{display:none;position:fixed;inset:0;background:#1926228a;z-index:10;padding:16px;overflow:auto;align-items:center;justify-content:center}.dialog.on{display:flex}.panel{background:var(--paper);border-radius:18px;padding:24px;width:min(510px,100%);max-height:90vh;overflow:auto}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;background:white}.field textarea{min-height:130px}.footer{font-size:12px;color:var(--muted);margin-top:34px}.danger{color:#ac4439}@media(max-width:600px){main{padding-top:24px}h1{font-size:30px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:14px;min-height:145px}.card h3{font-size:16px}.btn{padding:10px}.stats{gap:20px}}</style></head><body><main><div class="hero"><div class="small">THE WANDERING MIND</div><div class="top"><div><h1>精神漫游</h1><div class="muted">收集好奇，记录思考。这里不需要完成率。</div></div><button class="btn primary" id="add">＋ 添加作品</button></div></div><div class="stats"><div class="stat"><b id="total">0</b><span>全部收藏</span></div><div class="stat"><b id="ongoing">0</b><span>正在探索</span></div><div class="stat"><b id="done">0</b><span>已经完成</span></div></div><div class="actions"><button class="btn" id="import">↑ 导入私人数据</button><button class="btn" id="export">↓ 导出备份</button><button class="btn" id="reset">清空本机作品库</button><input type="file" id="file" accept=".json,application/json" hidden></div><div class="filters"><input type="search" id="search" placeholder="搜索作品或笔记…"><select id="status"><option value="">全部进度</option><option>想探索</option><option>想读</option><option>想看</option><option>想玩</option><option>进行中</option><option>已完成</option><option>暂时搁置</option></select><select id="categoryFilter"><option value="">全部类别</option></select></div><div class="grid" id="grid"></div><div class="empty" id="empty"><div class="small">YOUR COLLECTION</div><h2>故事从这里开始</h2><p class="muted">当前设备上还没有作品。导入私人 JSON 书单，或添加第一部作品。</p><button class="btn primary" id="emptyImport">导入作品库</button></div><div class="footer">你的作品与笔记只保存在此浏览器的本地存储中，不会由本站上传到 GitHub。清理 Safari 网站数据可能导致丢失，建议定期导出备份。任何有权使用这台设备和浏览器的人仍可能看到本地数据。</div></main><div class="dialog" id="dialog"><div class="panel"><h2 id="dialogTitle">添加作品</h2><div class="field"><label>作品名称</label><input id="title"></div><div class="field"><label>类别</label><input id="category" placeholder="例如：小说 / 文学"></div><div class="field"><label>状态</label><select id="editStatus"><option>想探索</option><option>想读</option><option>想看</option><option>想玩</option><option>进行中</option><option>已完成</option><option>暂时搁置</option></select></div><div class="field"><label>进度百分比（0–100）</label><input type="number" min="0" max="100" id="progress"></div><div class="field"><label>评分（0–5）</label><input type="number" min="0" max="5" step=".5" id="rating"></div><div class="field"><label>笔记和感想</label><textarea id="notes" placeholder="随时记录你的想法…"></textarea></div><div class="actions"><button class="btn primary" id="save">保存</button><button class="btn" id="cancel">取消</button><button class="btn danger" id="delete">删除作品</button></div></div></div><script>
const KEY='mind-wander-local-v1';let works=[],current=null;const $=id=>document.getElementById(id);const clone=o=>JSON.parse(JSON.stringify(o));try{let a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a))works=a}catch(e){}const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(KEY,JSON.stringify(works))}catch(e){alert('浏览器存储失败，请立即导出备份')}}function render(){let q=$('search').value.trim().toLowerCase(),st=$('status').value,cat=$('categoryFilter').value;let cats=[...new Set(works.map(w=>w.category).filter(Boolean))].sort();$('categoryFilter').innerHTML='<option value="">全部类别</option>'+cats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');$('categoryFilter').value=cat;$('total').textContent=works.length;$('ongoing').textContent=works.filter(w=>w.status==='进行中').length;$('done').textContent=works.filter(w=>w.status==='已完成').length;let found=works.filter(w=>(!q||(w.title+' '+w.notes+' '+w.category).toLowerCase().includes(q))&&(!st||w.status===st)&&(!cat||w.category===cat));$('grid').innerHTML=found.map(w=>'<button class="card" data-id="'+esc(w.id)+'"><span class="cat">'+esc(w.category||'未分类')+'</span><h3>'+esc(w.title)+'</h3><div class="meta">'+esc(w.status||'想探索')+(w.progress?' · '+esc(w.progress)+'%':'')+(w.rating?' · ★ '+esc(w.rating):'')+'</div></button>').join('');$('empty').style.display=works.length?'none':'block';document.querySelectorAll('.card').forEach(el=>el.onclick=()=>edit(el.dataset.id))}function edit(id){current=id;let w=works.find(x=>x.id===id)||{title:'',category:'小说 / 文学',status:'想探索',progress:0,rating:0,notes:''};$('dialogTitle').textContent=id?'编辑作品':'添加作品';for(let key of ['title','category','progress','rating','notes'])$(key).value=w[key]??'';$('editStatus').value=w.status||'想探索';$('delete').style.display=id?'':'none';$('dialog').classList.add('on')}$('add').onclick=()=>edit(null);$('cancel').onclick=()=>$('dialog').classList.remove('on');$('dialog').onclick=e=>{if(e.target===$('dialog'))$('cancel').click()};$('save').onclick=()=>{let title=$('title').value.trim();if(!title)return alert('请填写作品名称');let w={id:current||'custom-'+Date.now(),title,category:$('category').value.trim()||'未分类',status:$('editStatus').value,progress:Math.min(100,Math.max(0,Number($('progress').value)||0)),rating:Math.min(5,Math.max(0,Number($('rating').value)||0)),notes:$('notes').value};if(current){let i=works.findIndex(x=>x.id===current);if(i>=0)works[i]=w}else works.unshift(w);persist();$('cancel').click();render()};$('delete').onclick=()=>{if(current&&confirm('删除这部作品及其本机笔记？')){works=works.filter(w=>w.id!==current);persist();$('cancel').click();render()}};for(let id of ['search','status','categoryFilter'])$(id).addEventListener(id==='search'?'input':'change',render);$('import').onclick=$('emptyImport').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());let arr=Array.isArray(data)?data:data.works;if(!Array.isArray(arr)||!arr.every(x=>x&&typeof x.title==='string'))throw Error('格式不正确');if(confirm('将导入 '+arr.length+' 条作品并覆盖当前本机内容。请确认已经备份。')){works=arr.filter(x=>x.title!=='梦的解析').map((x,i)=>({id:String(x.id||'import-'+i),title:x.title,category:String(x.category||'未分类'),status:String(x.status||'想探索'),progress:Number(x.progress)||0,rating:Number(x.rating)||0,notes:String(x.notes||'')}));persist();render()}}catch(err){alert('导入失败：请选择作品库 JSON 文件。')}e.target.value=''};$('export').onclick=()=>{let b=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),works},null,2)],{type:'application/json'});let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='精神漫游-私人备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)};$('reset').onclick=()=>{if(confirm('清空本机所有收藏及笔记？此操作不可恢复，请先导出备份。')){works=[];persist();render()}};render();
</script></body></html>
